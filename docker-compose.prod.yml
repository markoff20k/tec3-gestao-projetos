version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: tec3-db-prod
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tec3_gestao}
      POSTGRES_USER: ${POSTGRES_USER:-tec3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - tec3_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init/001-seed-current.sql:/docker-entrypoint-initdb.d/001-seed-current.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tec3} -d ${POSTGRES_DB:-tec3_gestao}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tec3_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tec3-app-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      SESSION_SECRET: ${SESSION_SECRET}
      APP_STARTUP_SEED_MODE: ${APP_STARTUP_SEED_MODE:-baseline}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tec3}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tec3_gestao}

      LDAP_AD_URL: ${LDAP_AD_URL:-}
      LDAP_AD_BASE_DN: ${LDAP_AD_BASE_DN:-}
      LDAP_AD_BIND_DN: ${LDAP_AD_BIND_DN:-}
      LDAP_AD_BIND_PASSWORD: ${LDAP_AD_BIND_PASSWORD:-}
      LDAP_AD_DOMAIN: ${LDAP_AD_DOMAIN:-}
      LDAP_AD_BIND_FORMAT: ${LDAP_AD_BIND_FORMAT:-}
      LDAP_AD_USER_FILTER: ${LDAP_AD_USER_FILTER:-}

      LDAP_OPENLDAP_URL: ${LDAP_OPENLDAP_URL:-}
      LDAP_OPENLDAP_BASE_DN: ${LDAP_OPENLDAP_BASE_DN:-}
      LDAP_OPENLDAP_BIND_DN: ${LDAP_OPENLDAP_BIND_DN:-}
      LDAP_OPENLDAP_BIND_PASSWORD: ${LDAP_OPENLDAP_BIND_PASSWORD:-}
      LDAP_OPENLDAP_USER_FILTER: ${LDAP_OPENLDAP_USER_FILTER:-}

      LDAP_ROLE_ADMIN_DNS: ${LDAP_ROLE_ADMIN_DNS:-}
      LDAP_ROLE_COMMERCIAL_DNS: ${LDAP_ROLE_COMMERCIAL_DNS:-}
      LDAP_ROLE_PROJECTS_DNS: ${LDAP_ROLE_PROJECTS_DNS:-}
      LDAP_AD_ROLE_ADMIN_DNS: ${LDAP_AD_ROLE_ADMIN_DNS:-}
      LDAP_AD_ROLE_COMMERCIAL_DNS: ${LDAP_AD_ROLE_COMMERCIAL_DNS:-}
      LDAP_AD_ROLE_PROJECTS_DNS: ${LDAP_AD_ROLE_PROJECTS_DNS:-}
      LDAP_OPENLDAP_ROLE_ADMIN_DNS: ${LDAP_OPENLDAP_ROLE_ADMIN_DNS:-}
      LDAP_OPENLDAP_ROLE_COMMERCIAL_DNS: ${LDAP_OPENLDAP_ROLE_COMMERCIAL_DNS:-}
      LDAP_OPENLDAP_ROLE_PROJECTS_DNS: ${LDAP_OPENLDAP_ROLE_PROJECTS_DNS:-}
    volumes:
      - tec3_uploads_data:/app/uploads
    command: >
      sh -c "
      if [ \"$APP_STARTUP_SEED_MODE\" = \"off\" ] || [ \"$APP_STARTUP_SEED_MODE\" = \"none\" ] || [ \"$APP_STARTUP_SEED_MODE\" = \"disabled\" ]; then
        npm run start;
      else
        npx prisma migrate deploy --schema=prisma/schema.prisma && npm run start;
      fi
      "
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tec3_internal

  nginx:
    image: nginx:1.27-alpine
    container_name: tec3-nginx-prod
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tec3_internal

volumes:
  tec3_postgres_data:
  tec3_uploads_data:

networks:
  tec3_internal:
    driver: bridge
